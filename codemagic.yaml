workflows:
  ios-testflight:
    name: 猫カフェからの脱出 - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # CodemagicのCode signing identitiesに登録済みの
      # App Store配布用証明書・Provisioning ProfileをBundle IDで取得する。
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.catcafeescape
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.yutaXXX.catcafeescape"
      xcode: latest
      node: latest
    integrations:
      app_store_connect: oddiro_asc_key

    scripts:
      - name: npm install
        script: |
          npm install

      - name: Capacitor sync (www/ → ios/App/App/public)
        script: |
          npx cap sync ios

      - name: ビルド番号をCodemagicのビルド番号へ同期
        script: |
          cd ios/App
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $PROJECT_BUILD_NUMBER;/g" App.xcodeproj/project.pbxproj

      - name: コード署名のセットアップ
        script: |
          # environment.ios_signing で取得された証明書・Provisioning Profileを
          # Xcodeプロジェクトの署名設定へ適用する。
          xcode-project use-profiles

      - name: Xcodeビルド(.ipa作成)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
          # Capacitor 8はSPM構成のため --workspace ではなく --project を使用する。

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - App Store Connect Users
