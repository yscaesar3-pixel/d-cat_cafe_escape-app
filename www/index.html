<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover">

<meta
  name="apple-mobile-web-app-capable"
  content="yes">

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent">

<!--
STEP12-A:
初期リリース対象はiPhone縦画面のみ。
Capacitorビルド時はネイティブ側でもPortrait固定。
-->

<title>猫カフェからの脱出</title>

<link
  rel="stylesheet"
  href="css/style.css">

</head>


<body>


<div id="app">


  <!-- =====================================================
       TITLE
       ===================================================== -->

  <section
    id="screen-title"
    class="screen">

    <div
      class="screen-inner title-inner">

      <p
        class="title-eyebrow">
        閉店後の、ひみつの時間。
      </p>

      <h1
        class="title-logo">
        猫カフェ<br>
        からの脱出
      </h1>

      <div
        class="title-cats"
        aria-hidden="true">

        <span class="paw">🐾</span>
        <span class="paw">🐾</span>
        <span class="paw">🐾</span>

      </div>

      <button
        class="btn btn-primary"
        id="btn-title-start">
        はじめる
      </button>

      <button
        class="btn btn-text"
        id="btn-title-continue">
        つづきから
      </button>

    </div>

  </section>



  <!-- =====================================================
       INTRO
       ===================================================== -->

  <section
    id="screen-intro"
    class="screen">

    <div
      class="screen-inner intro-inner">

      <h2
        class="section-heading">
        Prologue
      </h2>

      <p
        class="intro-text">

        アルバイトの片付けを終えて出ようとしたら、<br>
        入口のドアに鍵がかかっていた。<br><br>

        閉店後の猫カフェにひとり取り残されてしまったみたい。<br>

        猫たちの様子や、店内に残されたヒントを頼りに、<br>

        出口を探そう。

      </p>

      <button
        class="btn btn-primary"
        id="btn-intro-start">

        お店を見てみる

      </button>

    </div>

  </section>



  <!-- =====================================================
       GAME
       ===================================================== -->

  <section
    id="screen-game"
    class="screen">


    <div
      class="game-topbar">

      <div
        class="game-topbar-left">

        <button
          class="btn btn-secondary btn-compact"
          id="btn-exit-staff-room"
          style="display:none;">

          CAFEへ戻る

        </button>

        <div
          class="room-label"
          id="room-label">

          CAT CAFE

        </div>

      </div>


      <div
        class="game-topbar-actions">

        <button
          class="btn btn-secondary btn-compact"
          id="btn-open-memo-game">

          MEMO

        </button>

        <button
          class="icon-btn"
          id="btn-open-menu"
          aria-label="メニュー">

          ≡

        </button>

      </div>

    </div>


    <div
      class="wall-message"
      id="wall-message">
    </div>


    <div
      class="wall-stage"
      id="wall-stage">

      <div
        class="wall-image-frame"
        id="wall-image-frame">

        <img
          id="wall-bg-img"
          class="wall-bg-img"
          alt="">


        <div
          class="wall-bg-fallback"
          id="wall-bg-fallback">
        </div>


        <div
          class="wall-overlay-layer"
          id="wall-overlay-layer">
        </div>


        <div
          class="hotspot-layer"
          id="hotspot-layer">
        </div>

      </div>

    </div>


    <button
      class="nav-arrow nav-left"
      id="nav-left"
      aria-label="左へ">

      ‹

    </button>


    <button
      class="nav-arrow nav-right"
      id="nav-right"
      aria-label="右へ">

      ›

    </button>


    <div
      class="inventory-bar"
      id="inventory-bar-game">
    </div>


  </section>



  <!-- =====================================================
       ZOOM
       ===================================================== -->

  <section
    id="screen-zoom"
    class="screen">

    <div
      class="zoom-topbar">

      <button
        class="btn btn-secondary btn-compact"
        id="btn-open-memo-zoom">

        MEMO

      </button>


      <button
        class="icon-btn"
        id="btn-zoom-close"
        aria-label="閉じる">

        ✕

      </button>

    </div>


    <div
      class="zoom-stage"
      id="zoom-stage">
    </div>


    <div
      class="inventory-bar"
      id="inventory-bar-zoom">
    </div>

  </section>



  <!-- =====================================================
       ITEM DETAIL
       ===================================================== -->

  <section
    id="screen-itemdetail"
    class="screen">

    <div
      class="screen-inner itemdetail-inner">

      <div
        class="itemdetail-image-frame">

        <img
          id="itemdetail-img"
          class="itemdetail-img"
          alt="">


        <div
          class="itemdetail-fallback"
          id="itemdetail-fallback">
        </div>

      </div>


      <p
        class="itemdetail-name"
        id="itemdetail-name">

        アイテム名（未実装）

      </p>


      <button
        class="btn btn-text"
        id="btn-itemdetail-close">

        閉じる

      </button>

    </div>

  </section>



  <!-- =====================================================
       HINT
       ===================================================== -->

  <section
    id="screen-hint"
    class="screen">

    <div
      class="screen-inner hint-inner">

      <h2
        class="section-heading">

        ヒント

      </h2>


      <p
        class="hint-placeholder"
        id="hint-text">

        ヒントを読み込み中…

      </p>


      <button
        class="btn btn-secondary"
        id="btn-hint-next">

        次のヒントを見る（広告）

      </button>


      <button
        class="btn btn-primary"
        id="btn-hint-close">

        閉じる

      </button>

    </div>

  </section>



  <!-- =====================================================
       MEMO
       ===================================================== -->

  <section
    id="screen-memo"
    class="screen">

    <div
      class="screen-inner memo-inner">


      <div
        class="memo-header">

        <h2
          class="section-heading">

          MEMO

        </h2>


        <button
          class="icon-btn"
          id="btn-memo-close"
          aria-label="閉じる">

          ✕

        </button>

      </div>


      <textarea
        id="memo-text"
        class="memo-textarea"
        maxlength="2000"
        placeholder="気になったことを自由にメモできます。">
      </textarea>


    </div>

  </section>



  <!-- =====================================================
       MENU
       ===================================================== -->

  <section
    id="screen-menu"
    class="screen">

    <div
      class="screen-inner menu-inner">


      <h2
        class="section-heading">

        MENU

      </h2>


      <button
        class="btn btn-secondary"
        id="btn-menu-resume">

        ゲームにもどる

      </button>


      <button
        class="btn btn-secondary"
        id="btn-menu-bgm">

        BGM：ON

      </button>


      <button
        class="btn btn-secondary"
        id="btn-menu-se">

        効果音：ON

      </button>


      <button
        class="btn btn-secondary"
        id="btn-menu-hint">

        広告を見てヒント

      </button>


      <button
        class="btn btn-secondary"
        id="btn-menu-title">

        タイトルへ

      </button>


    </div>

  </section>



  <!-- =====================================================
       CLEAR SEQUENCE
       ===================================================== -->

  <section
    id="screen-clearseq"
    class="screen">

    <div
      class="screen-inner clearseq-inner">

      <p
        class="clearseq-text"
        id="clearseq-text">
      </p>

    </div>

  </section>



  <!-- =====================================================
       CLEAR RESULT
       ===================================================== -->

  <section
    id="screen-clearresult"
    class="screen">

    <div
      class="screen-inner clearresult-inner">

      <h2
        class="section-heading">

        CLEAR

      </h2>


      <p
        class="clearresult-title">

        脱出成功！

      </p>


      <p
        class="clearresult-message">

        猫カフェから無事に脱出できた！

      </p>


      <p
        class="clearresult-time"
        id="clearresult-time">
      </p>


      <button
        class="btn btn-primary"
        id="btn-clearresult-title">

        タイトルへ戻る

      </button>

    </div>

  </section>


</div>



<!-- =======================================================
     横画面案内
     ======================================================= -->

<div
  id="orientation-lock">

  <p>📱</p>

  <p>
    縦画面でご利用ください
  </p>

</div>



<!-- =======================================================
     JS
     ======================================================= -->

<script src="js/audio.js"></script>
<script src="js/state.js"></script>
<script src="js/persistence.js"></script>
<script src="js/flags.js"></script>
<script src="js/items.js"></script>
<script src="js/inventory.js"></script>
<script src="js/zoom.js"></script>
<script src="js/wall1.js"></script>
<script src="js/wall2.js"></script>
<script src="js/wall3.js"></script>
<script src="js/wall4.js"></script>
<script src="js/staffroom1.js"></script>
<script src="js/staffroom2.js"></script>
<script src="js/hints.js"></script>
<script src="js/clear.js"></script>
<script src="js/ads.js"></script>
<script src="js/screens.js"></script>
<script src="js/main.js"></script>


<script>

  // -------------------------------------------------------
  // BGM開始
  // iOS / ブラウザの自動再生制限対策
  // -------------------------------------------------------


  // NEW GAME
  document
    .getElementById(
      "btn-intro-start"
    )
    ?.addEventListener(
      "click",
      () => {

        playBGM();

      }
    );


  // CONTINUE
  document
    .getElementById(
      "btn-title-continue"
    )
    ?.addEventListener(
      "click",
      () => {

        playBGM();

      }
    );

</script>


</body>

</html>
